<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星际拾光者</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7fbff;
      --muted: #b7c7d6;
      --panel: rgba(9, 18, 30, 0.72);
      --line: rgba(255, 255, 255, 0.18);
      --gold: #ffd166;
      --rose: #ef476f;
      --mint: #06d6a0;
      --cyan: #4cc9f0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07111f;
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .game {
      position: relative;
      width: min(100vw, 1100px);
      height: min(100vh, 760px);
      min-height: 560px;
      background:
        radial-gradient(circle at 18% 18%, rgba(76, 201, 240, 0.2), transparent 26%),
        radial-gradient(circle at 82% 12%, rgba(255, 209, 102, 0.15), transparent 22%),
        linear-gradient(160deg, #09182b 0%, #0d2135 46%, #10141f 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
      isolation: isolate;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .hud {
      position: absolute;
      inset: 18px 18px auto;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      pointer-events: none;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill,
    .button {
      min-width: 88px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
    }

    .pill {
      border-radius: 8px;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.1;
    }

    .value {
      display: block;
      margin-top: 3px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
    }

    .power-pill {
      min-width: 184px;
    }

    .power-pill .value {
      font-size: 15px;
      line-height: 1.2;
    }

    .button {
      pointer-events: auto;
      border-radius: 8px;
      color: var(--ink);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    .button:hover,
    .button:focus-visible {
      outline: 2px solid rgba(76, 201, 240, 0.7);
      outline-offset: 2px;
      background: rgba(17, 33, 52, 0.88);
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, rgba(4, 10, 20, 0.14), rgba(4, 10, 20, 0.62));
    }

    .card {
      width: min(92vw, 470px);
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(7, 16, 28, 0.88);
      padding: 26px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 6vw, 58px);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 0 auto 18px;
      max-width: 34ch;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }

    .primary {
      width: 100%;
      min-height: 48px;
      border-color: rgba(255, 209, 102, 0.45);
      background: linear-gradient(135deg, #ffd166, #ff8fab);
      color: #24131c;
    }

    .tips {
      margin-top: 14px;
      color: #d9e5ef;
      font-size: 13px;
    }

    .leaderboard {
      margin: 18px 0 0;
      border-top: 1px solid var(--line);
      padding-top: 16px;
      text-align: left;
    }

    .leaderboard-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .name-field {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .name-field input {
      width: 100%;
      min-width: 0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(4, 10, 24, 0.46);
      color: var(--text);
      font: inherit;
      padding: 8px 10px;
      outline: 0;
    }

    .name-field input:focus {
      border-color: rgba(0, 209, 255, 0.65);
      box-shadow: 0 0 0 3px rgba(0, 209, 255, 0.14);
    }

    .rank-list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .rank-list li {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 7px 9px;
      color: #eaf4ff;
      font-size: 14px;
    }

    .rank-list li:first-child {
      border-color: rgba(255, 209, 102, 0.42);
      background: rgba(255, 209, 102, 0.11);
    }

    .rank-score {
      color: var(--gold);
      font-weight: 850;
    }

    .rank-date {
      color: var(--muted);
      font-size: 12px;
    }

    .mini-button {
      border: 0;
      background: transparent;
      color: var(--cyan);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .mini-button:hover,
    .mini-button:focus-visible {
      text-decoration: underline;
      outline: 0;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 680px) {
      .game {
        width: 100vw;
        height: 100vh;
        min-height: 0;
        border: 0;
      }

      .hud {
        inset: 10px 10px auto;
        align-items: flex-start;
      }

      .stats {
        gap: 7px;
      }

      .pill {
        min-width: 72px;
        padding: 8px 9px;
      }

      .power-pill {
        min-width: 158px;
      }

      .value {
        font-size: 18px;
      }

      .button {
        min-width: 72px;
        padding: 9px 10px;
      }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="星际拾光者网页小游戏">
    <canvas id="scene"></canvas>
    <section class="hud" aria-live="polite">
      <div class="stats">
        <div class="pill">
          <span class="label">分数</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="pill">
          <span class="label">生命</span>
          <span class="value" id="lives">3</span>
        </div>
        <div class="pill">
          <span class="label">连击</span>
          <span class="value" id="combo">x1</span>
        </div>
        <div class="pill">
          <span class="label">最高</span>
          <span class="value" id="best">0</span>
        </div>
        <div class="pill power-pill">
          <span class="label">状态</span>
          <span class="value" id="power">普通</span>
        </div>
      </div>
      <button class="button" id="pause" type="button" aria-label="暂停或继续游戏">暂停</button>
    </section>
    <section class="overlay" id="overlay">
      <div class="card">
        <h1>星际拾光者</h1>
        <p id="message">驾驶小飞船收集星光，躲开陨石。连击越高，分数越香。</p>
        <button class="button primary" id="start" type="button">开始游戏</button>
        <div class="leaderboard" aria-label="全网排行榜">
          <div class="leaderboard-title">
            <span>全网排行榜</span>
            <button class="mini-button" id="refreshRanks" type="button">刷新</button>
          </div>
          <label class="name-field">
            <span>昵称</span>
            <input id="playerName" maxlength="16" autocomplete="nickname" aria-label="排行榜昵称" />
          </label>
          <ol class="rank-list" id="rankList"></ol>
        </div>
        <div class="tips">方向键 / WASD 移动，空格暂停。手机上拖动飞船即可。</div>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.querySelector("#scene");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.querySelector("#score");
    const livesEl = document.querySelector("#lives");
    const comboEl = document.querySelector("#combo");
    const bestEl = document.querySelector("#best");
    const powerEl = document.querySelector("#power");
    const overlay = document.querySelector("#overlay");
    const message = document.querySelector("#message");
    const startButton = document.querySelector("#start");
    const pauseButton = document.querySelector("#pause");
    const rankList = document.querySelector("#rankList");
    const refreshRanksButton = document.querySelector("#refreshRanks");
    const playerNameInput = document.querySelector("#playerName");

    const leaderboardApi = "https://star-catcher-game.lingz20581.chatgpt.site/api/leaderboard";
    const playerNameKey = "star-catcher-player-name-v1";

    const keys = new Set();
    const state = {
      running: false,
      paused: false,
      width: 0,
      height: 0,
      level: 1,
      score: 0,
      lives: 3,
      combo: 1,
      time: 0,
      powerTime: 0,
      startedAt: 0,
      last: 0,
      spawnStar: 0,
      spawnRock: 0,
      nextPowerAt: 15,
      powerStep: 0,
      shake: 0,
      invincible: 0,
      magnet: 0,
      magnetLevel: 0,
      blaster: 0,
      blasterLevel: 0,
      weaponMod: "",
      weaponModTime: 0,
      fireCooldown: 0,
      bossAt: 90,
      bossSpawned: false,
      boss: null,
      levelBanner: 0,
      ship: { x: 0, y: 0, r: 18, vx: 0, vy: 0 },
      stars: [],
      rocks: [],
      bullets: [],
      bossShots: [],
      loots: [],
      sparks: [],
      dust: []
    };

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      state.width = rect.width;
      state.height = rect.height;
      canvas.width = Math.floor(rect.width * scale);
      canvas.height = Math.floor(rect.height * scale);
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      state.ship.x = state.ship.x || state.width / 2;
      state.ship.y = state.ship.y || state.height * 0.72;
      makeDust();
    }

    function makeDust() {
      state.dust = Array.from({ length: Math.floor(state.width * state.height / 14500) }, () => ({
        x: Math.random() * state.width,
        y: Math.random() * state.height,
        r: Math.random() * 1.8 + 0.4,
        speed: Math.random() * 18 + 8,
        alpha: Math.random() * 0.55 + 0.2
      }));
    }

    function reset() {
      state.running = true;
      state.paused = false;
      state.level = 1;
      state.score = 0;
      state.lives = 3;
      state.combo = 1;
      state.time = 0;
      state.powerTime = 0;
      state.startedAt = performance.now();
      state.last = state.startedAt;
      state.spawnStar = 0;
      state.spawnRock = 0;
      state.nextPowerAt = 15;
      state.powerStep = 0;
      state.shake = 0;
      state.invincible = 0;
      state.magnet = 0;
      state.magnetLevel = 0;
      state.blaster = 0;
      state.blasterLevel = 0;
      state.weaponMod = "";
      state.weaponModTime = 0;
      state.fireCooldown = 0;
      state.bossAt = 90;
      state.bossSpawned = false;
      state.boss = null;
      state.levelBanner = 0;
      state.stars = [];
      state.rocks = [];
      state.bullets = [];
      state.bossShots = [];
      state.loots = [];
      state.sparks = [];
      state.ship = { x: state.width / 2, y: state.height * 0.72, r: 18, vx: 0, vy: 0 };
      overlay.classList.add("hidden");
      pauseButton.textContent = "暂停";
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = state.score;
      livesEl.textContent = state.lives;
      comboEl.textContent = `x${state.combo}`;
      const powers = [`L${state.level}`];
      if (state.invincible > 0) powers.push(`无敌 ${Math.ceil(state.invincible)}s`);
      if (state.magnet > 0) powers.push(`磁力Lv${state.magnetLevel} ${Math.ceil(state.magnet)}s`);
      if (state.blaster > 0) powers.push(`火力Lv${state.blasterLevel} ${Math.ceil(state.blaster)}s`);
      if (state.weaponModTime > 0) powers.push(`${state.weaponMod === "homing" ? "追踪" : "霰弹"} ${Math.ceil(state.weaponModTime)}s`);
      if (!state.bossSpawned) powers.push(`Boss ${Math.max(0, Math.ceil(state.bossAt - state.powerTime))}s`);
      if (state.boss) powers.push("Boss战");
      powerEl.textContent = powers.length ? powers.join(" · ") : "普通";
    }

    function getPlayerName() {
      const value = playerNameInput.value.trim().replace(/\s+/g, " ").slice(0, 16);
      const name = value || `玩家${Math.floor(Math.random() * 9000 + 1000)}`;
      playerNameInput.value = name;
      try {
        localStorage.setItem(playerNameKey, name);
      } catch {
        // Ignore private browsing storage errors; the score can still be submitted.
      }
      return name;
    }

    async function fetchRanks() {
      const response = await fetch(`${leaderboardApi}?t=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error("leaderboard unavailable");
      const data = await response.json();
      return Array.isArray(data.scores) ? data.scores : [];
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function paintRanks(ranks, fallbackText = "还没有成绩") {
      rankList.innerHTML = "";
      if (ranks.length === 0) {
        const empty = document.createElement("li");
        empty.innerHTML = `<span>#</span><span>${fallbackText}</span><span class="rank-date">开一局</span>`;
        rankList.append(empty);
        bestEl.textContent = "0";
        return;
      }
      ranks.forEach((rank, index) => {
        const item = document.createElement("li");
        const date = rank.created_at ? String(rank.created_at).slice(5, 10) : "";
        const name = escapeHtml(String(rank.name || "匿名玩家").slice(0, 16));
        item.innerHTML = `
          <span>#${index + 1}</span>
          <span><strong class="rank-score">${rank.score}</strong> ${name}</span>
          <span class="rank-date">${date}</span>
        `;
        rankList.append(item);
      });
      bestEl.textContent = ranks[0].score;
    }

    async function renderRanks() {
      rankList.innerHTML = "<li><span>#</span><span>正在同步全网榜...</span><span class=\"rank-date\">稍等</span></li>";
      try {
        paintRanks(await fetchRanks());
      } catch {
        paintRanks([], "全网排行榜暂时连接失败");
      }
    }

    async function saveRank(score) {
      if (score <= 0) {
        await renderRanks();
        return;
      }
      try {
        const response = await fetch(leaderboardApi, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: getPlayerName(), score })
        });
        if (!response.ok) throw new Error("score submit failed");
        const data = await response.json();
        paintRanks(Array.isArray(data.scores) ? data.scores : []);
      } catch {
        paintRanks([], "成绩提交失败，稍后再试");
      }
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function powerTone(kind) {
      if (kind === "shield") return "red";
      if (kind === "magnet") return "blue";
      if (kind === "blaster") return "purple";
      return "gold";
    }

    function scheduledPowerKind() {
      if (state.nextPowerAt < 30) return "shield";
      if (state.nextPowerAt < 45) return "magnet";
      if (state.nextPowerAt < 60) return "blaster";
      return ["shield", "magnet", "blaster"][state.powerStep % 3];
    }

    function spawnStar(kind = "score") {
      let tone = Math.random() > 0.22 ? "gold" : "mint";
      if (kind !== "score") {
        tone = powerTone(kind);
      }
      state.stars.push({
        x: rand(28, state.width - 28),
        y: -24,
        r: rand(9, 15),
        speed: rand(76, 118) + state.time * 2,
        spin: rand(0, Math.PI * 2),
        tone,
        kind
      });
    }

    function spawnRock() {
      const large = state.level >= 2 && Math.random() < 0.36;
      const size = large ? rand(31, 46) : rand(14, 28);
      state.rocks.push({
        x: rand(size, state.width - size),
        y: -38,
        r: size,
        hp: large ? 6 : state.level >= 2 ? 3 : 3,
        maxHp: large ? 6 : state.level >= 2 ? 3 : 3,
        large,
        speed: (large ? rand(86, 132) : rand(124, 192)) + state.time * (state.level >= 2 ? 3.8 : 3.2),
        spin: rand(-2.2, 2.2),
        angle: rand(0, Math.PI * 2)
      });
    }

    function burst(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        state.sparks.push({
          x,
          y,
          vx: rand(-130, 130),
          vy: rand(-150, 90),
          life: rand(0.35, 0.8),
          max: 0.8,
          color
        });
      }
    }

    function collide(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const rr = a.r + b.r;
      return dx * dx + dy * dy < rr * rr;
    }

    function starColor(star) {
      if (star.kind === "shield") return "#ef476f";
      if (star.kind === "magnet") return "#4cc9f0";
      if (star.kind === "blaster") return "#b967ff";
      return star.tone === "mint" ? "#06d6a0" : "#ffd166";
    }

    function lootColor(type) {
      if (type === "homing") return "#ff8fab";
      if (type === "spread") return "#b967ff";
      if (type === "magnet") return "#4cc9f0";
      return "#ffd166";
    }

    function destroyRock(rock, color = "#ffd166") {
      rock.destroyed = true;
      state.score += 1000;
      state.shake = Math.max(state.shake, 4);
      burst(rock.x, rock.y, color, 28);
      if (state.level >= 2 && rock.large && Math.random() < 0.48) {
        spawnLoot(rock.x, rock.y);
      }
      updateHud();
    }

    function spawnLoot(x, y) {
      let type = "battery";
      if (state.blaster > 0) {
        type = Math.random() < 0.5 ? "homing" : "spread";
      } else if (state.magnet > 0 && Math.random() < 0.62) {
        type = "magnet";
      }
      state.loots.push({
        x,
        y,
        r: 13,
        type,
        speed: 78,
        spin: rand(0, Math.PI * 2)
      });
    }

    function collectLoot(loot) {
      if (loot.type === "homing") {
        state.blaster = Math.max(state.blaster, 10) + 6;
        state.blasterLevel = Math.max(2, state.blasterLevel);
        state.weaponMod = "homing";
        state.weaponModTime = 12;
      } else if (loot.type === "spread") {
        state.blaster = Math.max(state.blaster, 10) + 6;
        state.blasterLevel = 3;
        state.weaponMod = "spread";
        state.weaponModTime = 12;
      } else if (loot.type === "magnet") {
        state.magnet = Math.max(state.magnet, 10) + 7;
        state.magnetLevel = 3;
      } else {
        if (state.invincible > 0) state.invincible += 5;
        if (state.magnet > 0) state.magnet += 5;
        if (state.blaster > 0) state.blaster += 5;
        if (state.invincible <= 0 && state.magnet <= 0 && state.blaster <= 0) state.score += 500;
      }
      burst(loot.x, loot.y, lootColor(loot.type), 18);
      updateHud();
    }

    function spawnBoss() {
      state.bossSpawned = true;
      const isSecond = state.level >= 2;
      state.boss = {
        x: state.width / 2,
        y: isSecond ? 108 : 92,
        r: isSecond ? 72 : 58,
        hp: isSecond ? 620 : 260,
        maxHp: isSecond ? 620 : 260,
        vx: isSecond ? 168 : 120,
        shot: isSecond ? 0.58 : 0.8
      };
      burst(state.boss.x, state.boss.y, "#b967ff", 42);
    }

    function damageBoss(amount, color = "#b967ff") {
      if (!state.boss) return;
      state.boss.hp -= amount;
      state.shake = Math.max(state.shake, 2);
      burst(state.boss.x + rand(-28, 28), state.boss.y + rand(-18, 24), color, 8);
      if (state.boss.hp <= 0) {
        state.score += state.level >= 2 ? 9000 : 5000;
        burst(state.boss.x, state.boss.y, "#ffd166", 70);
        state.boss = null;
        if (state.level === 1) {
          startLevelTwo();
        } else {
          winGame();
        }
      }
      updateHud();
    }

    function startLevelTwo() {
      state.level = 2;
      state.lives = Math.min(5, state.lives + 1);
      state.bossSpawned = false;
      state.bossAt = state.powerTime + 65;
      state.nextPowerAt = state.powerTime + 9;
      state.powerStep = 0;
      state.rocks = [];
      state.bossShots = [];
      state.bullets = [];
      state.loots = [];
      state.levelBanner = 5;
      state.spawnRock = 0.8;
      state.spawnStar = 0.8;
      burst(state.ship.x, state.ship.y, "#4cc9f0", 36);
      updateHud();
    }

    function spawnBossShot() {
      if (!state.boss) return;
      const spread = state.level >= 2 ? Math.min(7, 5 + Math.floor(state.time / 55)) : Math.min(5, 3 + Math.floor(state.time / 40));
      for (let i = 0; i < spread; i++) {
        const offset = (i - (spread - 1) / 2) * (state.level >= 2 ? 16 : 18);
        state.bossShots.push({
          x: state.boss.x + offset,
          y: state.boss.y + 44,
          vx: offset * (state.level >= 2 ? 2.4 : 1.8),
          vy: (state.level >= 2 ? 238 : 205) + state.time * 0.9,
          r: state.level >= 2 ? 8 : 7
        });
      }
    }

    function collectStar(star) {
      let bonus = star.tone === "mint" ? 25 : 10;
      let sparks = 14;
      if (star.kind === "shield") {
        state.invincible = 10;
        bonus = 15;
        sparks = 24;
      } else if (star.kind === "magnet") {
        state.magnetLevel = state.magnet > 0 ? Math.min(3, state.magnetLevel + 1) : 1;
        state.magnet = 10;
        bonus = 15;
        sparks = 24;
      } else if (star.kind === "blaster") {
        state.blasterLevel = state.blaster > 0 ? Math.min(3, state.blasterLevel + 1) : 1;
        state.blaster = 10;
        state.fireCooldown = 0;
        bonus = 15;
        sparks = 28;
      }
      state.score += bonus * state.combo;
      state.combo = Math.min(9, state.combo + 1);
      burst(star.x, star.y, starColor(star), sparks);
      updateHud();
    }

    function moveShip(dt) {
      const ship = state.ship;
      let ax = 0;
      let ay = 0;
      if (keys.has("ArrowLeft") || keys.has("a")) ax -= 1;
      if (keys.has("ArrowRight") || keys.has("d")) ax += 1;
      if (keys.has("ArrowUp") || keys.has("w")) ay -= 1;
      if (keys.has("ArrowDown") || keys.has("s")) ay += 1;
      const len = Math.hypot(ax, ay) || 1;
      const speed = 720;
      ship.vx += (ax / len) * speed * dt;
      ship.vy += (ay / len) * speed * dt;
      ship.vx *= 0.84;
      ship.vy *= 0.84;
      ship.x += ship.vx * dt;
      ship.y += ship.vy * dt;
      ship.x = Math.max(ship.r + 8, Math.min(state.width - ship.r - 8, ship.x));
      ship.y = Math.max(92, Math.min(state.height - ship.r - 8, ship.y));
    }

    function shootBullet() {
      const level = Math.max(1, state.blasterLevel);
      const spreadMode = state.weaponMod === "spread";
      const homingMode = state.weaponMod === "homing";
      const offsets = spreadMode ? [-24, -12, 0, 12, 24] : level === 1 ? [0] : level === 2 ? [-7, 7] : [-11, 0, 11];
      for (const offset of offsets) {
        state.bullets.push({
          x: state.ship.x + offset,
          y: state.ship.y - 26,
          vx: offset * (spreadMode ? 5.2 : 2.5),
          vy: -680 - level * 70,
          r: 4 + level * 0.6,
          damage: homingMode ? 2 : level >= 3 ? 2 : 1,
          level,
          homing: homingMode
        });
      }
    }

    function update(dt) {
      if (!state.running || state.paused) return;
      const realElapsed = (performance.now() - state.startedAt) / 1000;
      state.time += dt;
      state.powerTime = realElapsed;
      state.spawnStar -= dt;
      state.spawnRock -= dt;
      state.shake = Math.max(0, state.shake - dt * 18);
      state.invincible = Math.max(0, state.invincible - dt);
      state.magnet = Math.max(0, state.magnet - dt);
      state.blaster = Math.max(0, state.blaster - dt);
      state.weaponModTime = Math.max(0, state.weaponModTime - dt);
      state.fireCooldown = Math.max(0, state.fireCooldown - dt);
      if (state.magnet <= 0) state.magnetLevel = 0;
      if (state.blaster <= 0) state.blasterLevel = 0;
      if (state.weaponModTime <= 0) state.weaponMod = "";
      state.levelBanner = Math.max(0, state.levelBanner - dt);
      updateHud();
      if (!state.bossSpawned && state.powerTime >= state.bossAt) {
        spawnBoss();
      }
      while (state.powerTime >= state.nextPowerAt) {
        spawnStar(scheduledPowerKind());
        state.powerStep += 1;
        state.nextPowerAt += 9;
      }
      if (state.spawnStar <= 0) {
        spawnStar();
        state.spawnStar = Math.max(0.72, 1.25 - state.time * 0.005);
      }
      if (state.spawnRock <= 0) {
        spawnRock();
        state.spawnRock = state.boss ? (state.level >= 2 ? 1.05 : 1.45) : Math.max(state.level >= 2 ? 0.34 : 0.42, 1.28 - state.time * (state.level >= 2 ? 0.018 : 0.014));
      }
      moveShip(dt);
      if (state.blaster > 0 && state.fireCooldown <= 0) {
        shootBullet();
        state.fireCooldown = Math.max(0.1, 0.21 - state.blasterLevel * 0.035);
      }

      for (const dust of state.dust) {
        dust.y += dust.speed * dt;
        if (dust.y > state.height + 4) {
          dust.y = -4;
          dust.x = Math.random() * state.width;
        }
      }

      for (const star of state.stars) {
        if (state.magnet > 0) {
          const dx = state.ship.x - star.x;
          const dy = state.ship.y - star.y;
          const distance = Math.hypot(dx, dy);
          const magnetRange = 160 + state.magnetLevel * 44;
          if (distance > 1 && distance < magnetRange) {
            const pull = (1 - distance / magnetRange) * (620 + state.magnetLevel * 260) + 150;
            star.x += (dx / distance) * pull * dt;
            star.y += (dy / distance) * pull * dt;
          }
        }
        star.y += star.speed * dt;
        star.spin += dt * 4.5;
      }
      for (const rock of state.rocks) {
        rock.y += rock.speed * dt;
        rock.angle += rock.spin * dt;
      }
      for (const loot of state.loots) {
        loot.y += loot.speed * dt;
        loot.spin += dt * 4.8;
      }
      if (state.boss) {
        state.boss.x += state.boss.vx * dt;
        if (state.boss.x < state.boss.r + 18 || state.boss.x > state.width - state.boss.r - 18) {
          state.boss.vx *= -1;
          state.boss.x = Math.max(state.boss.r + 18, Math.min(state.width - state.boss.r - 18, state.boss.x));
        }
        state.boss.shot -= dt;
        if (state.boss.shot <= 0) {
          spawnBossShot();
          state.boss.shot = Math.max(0.48, 1.05 - state.time * 0.004);
        }
      }
      if (state.boss && collide(state.ship, state.boss)) {
        if (state.invincible > 0) {
          state.shake = Math.max(state.shake, 4);
          burst(state.ship.x, state.ship.y, "#ffd166", 12);
          state.ship.y = Math.min(state.height - state.ship.r - 8, state.ship.y + 44);
        } else {
          state.lives -= 1;
          state.combo = 1;
          state.shake = 12;
          state.ship.y = Math.min(state.height - state.ship.r - 8, state.ship.y + 56);
          burst(state.ship.x, state.ship.y, "#ef476f", 18);
          updateHud();
          if (state.lives <= 0) endGame();
        }
      }
      for (const bullet of state.bullets) {
        if (bullet.homing) {
          const targets = state.boss ? [state.boss] : state.rocks.filter((rock) => !rock.destroyed);
          let target = null;
          let best = Infinity;
          for (const item of targets) {
            const d = Math.hypot(item.x - bullet.x, item.y - bullet.y);
            if (d < best) {
              best = d;
              target = item;
            }
          }
          if (target && best > 1) {
            bullet.vx += ((target.x - bullet.x) / best) * 560 * dt;
            bullet.vy += ((target.y - bullet.y) / best) * 260 * dt;
          }
        }
        bullet.x += (bullet.vx || 0) * dt;
        bullet.y += bullet.vy * dt;
      }
      for (const shot of state.bossShots) {
        shot.x += shot.vx * dt;
        shot.y += shot.vy * dt;
      }
      for (const spark of state.sparks) {
        spark.x += spark.vx * dt;
        spark.y += spark.vy * dt;
        spark.vy += 220 * dt;
        spark.life -= dt;
      }

      for (const bullet of state.bullets) {
        if (bullet.y < -24) {
          bullet.dead = true;
          continue;
        }
        if (state.boss && collide(bullet, state.boss)) {
          bullet.dead = true;
          damageBoss((bullet.damage || 1) * 4, "#b967ff");
          continue;
        }
        for (const rock of state.rocks) {
          if (rock.destroyed || !collide(bullet, rock)) continue;
          bullet.dead = true;
          rock.hp -= bullet.damage || 1;
          burst(bullet.x, bullet.y, "#b967ff", 6);
          if (rock.hp <= 0) destroyRock(rock, "#b967ff");
          break;
        }
      }

      state.stars = state.stars.filter((star) => {
        if (collide(state.ship, star)) {
          collectStar(star);
          return false;
        }
        if (star.y > state.height + 40) {
          state.combo = 1;
          updateHud();
          return false;
        }
        return true;
      });

      state.loots = state.loots.filter((loot) => {
        if (collide(state.ship, loot)) {
          collectLoot(loot);
          return false;
        }
        return loot.y < state.height + 44;
      });

      state.rocks = state.rocks.filter((rock) => {
        if (rock.destroyed) return false;
        if (collide(state.ship, rock)) {
          if (state.invincible > 0) {
            destroyRock(rock, "#ffd166");
            return false;
          }
          state.lives -= 1;
          state.combo = 1;
          state.shake = 10;
          burst(rock.x, rock.y, "#ef476f", 18);
          updateHud();
          if (state.lives <= 0) endGame();
          return false;
        }
        return rock.y < state.height + 54;
      });
      state.bossShots = state.bossShots.filter((shot) => {
        if (collide(state.ship, shot)) {
          if (state.invincible > 0) {
            burst(shot.x, shot.y, "#ffd166", 10);
            return false;
          }
          state.lives -= 1;
          state.combo = 1;
          state.shake = 8;
          burst(shot.x, shot.y, "#ef476f", 14);
          updateHud();
          if (state.lives <= 0) endGame(false);
          return false;
        }
        return shot.y < state.height + 40 && shot.x > -40 && shot.x < state.width + 40;
      });
      state.bullets = state.bullets.filter((bullet) => !bullet.dead);
      state.sparks = state.sparks.filter((spark) => spark.life > 0);
    }

    function drawShip() {
      const ship = state.ship;
      ctx.save();
      ctx.translate(ship.x, ship.y);
      if (state.magnet > 0) {
        ctx.save();
        ctx.globalAlpha = 0.32 + Math.sin(state.time * 7) * 0.08;
        ctx.strokeStyle = "#4cc9f0";
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 12]);
        ctx.beginPath();
        ctx.arc(0, 0, 160 + state.magnetLevel * 44, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      if (state.invincible > 0) {
        ctx.save();
        ctx.globalAlpha = 0.34 + Math.sin(state.time * 12) * 0.1;
        ctx.fillStyle = "rgba(239, 71, 111, 0.22)";
        ctx.strokeStyle = "#ef476f";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 36 + Math.sin(state.time * 8) * 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
      if (state.blaster > 0) {
        ctx.save();
        ctx.globalAlpha = 0.34 + Math.sin(state.time * 10) * 0.08;
        ctx.strokeStyle = "#b967ff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -6, 28 + Math.sin(state.time * 9) * 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      ctx.rotate(ship.vx * 0.002);
      ctx.fillStyle = "#f7fbff";
      ctx.strokeStyle = "rgba(76, 201, 240, 0.9)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -24);
      ctx.lineTo(18, 21);
      ctx.lineTo(0, 13);
      ctx.lineTo(-18, 21);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#4cc9f0";
      ctx.beginPath();
      ctx.ellipse(0, -4, 7, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255, 209, 102, 0.9)";
      ctx.beginPath();
      ctx.moveTo(-8, 19);
      ctx.lineTo(0, 34 + Math.sin(state.time * 14) * 4);
      ctx.lineTo(8, 19);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawStar(star) {
      ctx.save();
      ctx.translate(star.x, star.y);
      ctx.rotate(star.spin);
      ctx.fillStyle = starColor(star);
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 18;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const radius = i % 2 === 0 ? star.r : star.r * 0.44;
        const angle = i * Math.PI / 5 - Math.PI / 2;
        ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
      }
      ctx.closePath();
      ctx.fill();
      if (star.kind === "shield" || star.kind === "magnet" || star.kind === "blaster") {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.82)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, star.r + 5 + Math.sin(state.time * 8) * 2, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawRock(rock) {
      ctx.save();
      ctx.translate(rock.x, rock.y);
      ctx.rotate(rock.angle);
      ctx.fillStyle = rock.large ? "#596271" : "#7b8491";
      ctx.strokeStyle = rock.large ? "#ffd166" : "#c0c7d1";
      ctx.lineWidth = rock.large ? 3 : 2;
      ctx.beginPath();
      for (let i = 0; i < 9; i++) {
        const angle = i * Math.PI * 2 / 9;
        const radius = rock.r * rand(0.72, 1.05);
        ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      if (rock.hp < 3) {
        ctx.strokeStyle = rock.hp === 2 ? "#ffd166" : "#ef476f";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-rock.r * 0.3, -rock.r * 0.45);
        ctx.lineTo(rock.r * 0.06, -rock.r * 0.08);
        ctx.lineTo(-rock.r * 0.16, rock.r * 0.42);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawLoot(loot) {
      ctx.save();
      ctx.translate(loot.x, loot.y);
      ctx.rotate(loot.spin);
      const color = lootColor(loot.type);
      ctx.fillStyle = color;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.86)";
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -loot.r);
      ctx.lineTo(loot.r, 0);
      ctx.lineTo(0, loot.r);
      ctx.lineTo(-loot.r, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawBoss() {
      if (!state.boss) return;
      const boss = state.boss;
      ctx.save();
      ctx.translate(boss.x, boss.y);
      ctx.fillStyle = "#28143e";
      ctx.strokeStyle = "#b967ff";
      ctx.lineWidth = 3;
      ctx.shadowColor = "#b967ff";
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.moveTo(0, -boss.r);
      ctx.bezierCurveTo(boss.r * 0.86, -boss.r * 0.64, boss.r * 0.92, boss.r * 0.42, 0, boss.r * 0.72);
      ctx.bezierCurveTo(-boss.r * 0.92, boss.r * 0.42, -boss.r * 0.86, -boss.r * 0.64, 0, -boss.r);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#ef476f";
      ctx.beginPath();
      ctx.arc(-19, -8, 7, 0, Math.PI * 2);
      ctx.arc(19, -8, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255, 209, 102, 0.92)";
      ctx.beginPath();
      ctx.moveTo(-28, 38);
      ctx.lineTo(0, 54 + Math.sin(state.time * 11) * 4);
      ctx.lineTo(28, 38);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      const barWidth = Math.min(520, state.width - 44);
      const x = (state.width - barWidth) / 2;
      const y = 72;
      const ratio = Math.max(0, boss.hp / boss.maxHp);
      ctx.save();
      ctx.fillStyle = "rgba(7, 16, 28, 0.86)";
      ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
      ctx.lineWidth = 1;
      ctx.fillRect(x, y, barWidth, 12);
      ctx.strokeRect(x, y, barWidth, 12);
      ctx.fillStyle = "#ef476f";
      ctx.fillRect(x, y, barWidth * ratio, 12);
      ctx.fillStyle = "#f7fbff";
      ctx.font = "700 12px Segoe UI, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(state.level >= 2 ? "第二关 BOSS" : "第一关 BOSS", state.width / 2, y - 8);
      ctx.restore();
    }

    function drawBullet(bullet) {
      ctx.save();
      ctx.translate(bullet.x, bullet.y);
      ctx.fillStyle = bullet.homing ? "#ff8fab" : bullet.level >= 3 ? "#ffffff" : "#f4d7ff";
      ctx.shadowColor = bullet.homing ? "#ff8fab" : "#b967ff";
      ctx.shadowBlur = 12 + bullet.level * 5;
      ctx.beginPath();
      ctx.ellipse(0, -3, bullet.r, 10 + bullet.level * 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBossShot(shot) {
      ctx.save();
      ctx.translate(shot.x, shot.y);
      ctx.fillStyle = "#ef476f";
      ctx.shadowColor = "#ef476f";
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(0, 0, shot.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, state.width, state.height);
      ctx.save();
      if (state.shake > 0) {
        ctx.translate(rand(-state.shake, state.shake), rand(-state.shake, state.shake));
      }

      ctx.fillStyle = "#07111f";
      ctx.fillRect(0, 0, state.width, state.height);
      for (const dust of state.dust) {
        ctx.globalAlpha = dust.alpha;
        ctx.fillStyle = "#d9f2ff";
        ctx.beginPath();
        ctx.arc(dust.x, dust.y, dust.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (const star of state.stars) drawStar(star);
      for (const loot of state.loots) drawLoot(loot);
      for (const bullet of state.bullets) drawBullet(bullet);
      for (const rock of state.rocks) drawRock(rock);
      drawBoss();
      for (const shot of state.bossShots) drawBossShot(shot);
      for (const spark of state.sparks) {
        ctx.globalAlpha = Math.max(0, spark.life / spark.max);
        ctx.fillStyle = spark.color;
        ctx.beginPath();
        ctx.arc(spark.x, spark.y, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      drawShip();
      if (state.levelBanner > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, state.levelBanner / 1.2);
        ctx.fillStyle = "#f7fbff";
        ctx.font = "800 32px Segoe UI, system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("第二关", state.width / 2, state.height * 0.42);
        ctx.font = "700 15px Segoe UI, system-ui, sans-serif";
        ctx.fillStyle = "#b7c7d6";
        ctx.fillText("大石头会掉装备，Boss 更凶", state.width / 2, state.height * 0.42 + 30);
        ctx.restore();
      }
      ctx.restore();
    }

    function loop(now) {
      const dt = Math.min(0.033, (now - state.last) / 1000 || 0);
      state.last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function togglePause() {
      if (!state.running) return;
      state.paused = !state.paused;
      pauseButton.textContent = state.paused ? "继续" : "暂停";
      overlay.classList.toggle("hidden", !state.paused);
      message.textContent = "暂停中。休息好再继续冲分。";
      startButton.textContent = "继续游戏";
    }

    function endGame() {
      state.running = false;
      overlay.classList.remove("hidden");
      message.textContent = `挑战失败，本局得分 ${state.score}。正在提交全网排行榜。`;
      startButton.textContent = "再玩一次";
      pauseButton.textContent = "暂停";
      saveRank(state.score).then(() => {
        message.textContent = `挑战失败，本局得分 ${state.score}。调整节奏，再来一次。`;
      });
    }

    function winGame() {
      state.running = false;
      overlay.classList.remove("hidden");
      message.textContent = `第二关通过！最终得分 ${state.score}。正在提交全网排行榜。`;
      startButton.textContent = "再玩一次";
      pauseButton.textContent = "暂停";
      saveRank(state.score).then(() => {
        message.textContent = `第二关通过！最终得分 ${state.score}。两个 Boss 都已击破。`;
      });
    }

    window.addEventListener("resize", resize);
    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        togglePause();
        return;
      }
      keys.add(event.key);
    });
    window.addEventListener("keyup", (event) => keys.delete(event.key));
    canvas.addEventListener("pointermove", (event) => {
      if (!state.running || state.paused) return;
      const rect = canvas.getBoundingClientRect();
      state.ship.x = event.clientX - rect.left;
      state.ship.y = event.clientY - rect.top;
    });
    startButton.addEventListener("click", () => {
      if (state.running && state.paused) {
        togglePause();
      } else {
        reset();
      }
    });
    pauseButton.addEventListener("click", togglePause);
    refreshRanksButton.addEventListener("click", renderRanks);
    playerNameInput.addEventListener("change", getPlayerName);

    try {
      playerNameInput.value = localStorage.getItem(playerNameKey) || "";
    } catch {
      playerNameInput.value = "";
    }
    getPlayerName();

    resize();
    renderRanks();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
